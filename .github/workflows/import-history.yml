name: Import audited Shuiyu core history once

"on":
  push:
    branches: [main]
    paths:
      - '.github/history-import/**'
      - '.github/workflows/import-history.yml'

permissions:
  contents: read

concurrency:
  group: shuiyu-core-history-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'ShenTenghui/shuiyu-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the audited bundle and preserve the published application tree
        env:
          EXPECTED_REPOSITORY: ShenTenghui/shuiyu-core
          EXPECTED_REF: refs/heads/main
        run: python3 .github/history-import/import_history.py
